# Preparation only. Creating/deploying these resources requires authorization.
# Free PostgreSQL expires after 30 days; see docs/DEPLOYMENT.md.
databases:
  - name: englishquest-db
    plan: free
    databaseName: englishquest
    user: englishquest

services:
  - type: web
    name: englishquest-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /api/v1/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: GO_VERSION
        value: 1.26.0
      # Enter the Render connection URL WITH sslmode=require. Do not commit it.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: englishquest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 26.12.1
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
